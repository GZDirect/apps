<div id="modal" class="overlay" hidden></div><div id="busy" class="busy" hidden></div><div id="toast" class="toast" hidden></div>
<script>
// ===== LapTrezor – tiszta logika (tesztelhető) =====
const SCHEMA_VERSION = 1;
const GRADE_RAW = 'RAW';

function normGrade(g) {
  let s = String(g ?? '').trim().toUpperCase();
  if (!s || ['RAW', 'NYERS', 'UNGRADED', '-'].includes(s)) return GRADE_RAW;
  s = s.replace(/\s+/g, ' ').replace(/([A-Z])\s?(\d)/, '$1 $2');
  return s;
}
function gradeLabel(g) { return normGrade(g) === GRADE_RAW ? 'Nyers (raw)' : normGrade(g); }

function median(arr) {
  if (!arr.length) return null;
  const a = [...arr].sort((x, y) => x - y);
  const m = Math.floor(a.length / 2);
  return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
}
const DAY = 86400000;
function toTime(d) { const t = Date.parse(d); return isNaN(t) ? null : t; }

// Becslés egy laphoz. Csak pontos egyezésű, a példány állapotával egyező megfigyelések.
// Eladott ár elsőbbség; hirdetési ár soha nem ad értéket; kézi csak ha nincs eladott.
function computeValuation(card, observations, opts = {}) {
  const now = opts.now ?? Date.now();
  const staleDays = opts.staleDays ?? 90;
  const windowDays = opts.windowDays ?? 180;
  const basis = normGrade(card.valuationBasis);
  const rel = observations.filter(o => o.cardId === card.id && o.exactMatch === true &&
    normGrade(o.conditionGrade) === basis && Number(o.priceHuf) > 0 && toTime(o.transactionDate) != null);
  const sold = rel.filter(o => o.saleType === 'sold');
  const manual = rel.filter(o => o.saleType === 'manual');
  const listings = observations.filter(o => o.cardId === card.id && o.saleType === 'listing');
  let used = [], method, confidence;
  if (sold.length) {
    const recent = sold.filter(o => now - toTime(o.transactionDate) <= windowDays * DAY);
    used = recent.length ? recent : sold;
    method = `Medián, ${used.length} eladott ár (pontos egyezés, ${gradeLabel(basis)}${recent.length ? `, utolsó ${windowDays} nap` : ', régebbi adatok'})`;
    confidence = used.length >= 5 ? 'magas' : used.length >= 2 ? 'közepes' : 'alacsony';
  } else if (manual.length) {
    const last = [...manual].sort((a, b) => toTime(b.transactionDate) - toTime(a.transactionDate))[0];
    used = [last];
    method = `Kézi értékrögzítés (${gradeLabel(basis)})`;
    confidence = 'kézi';
  } else {
    return { empty: true, basis, listingsOnly: listings.length > 0 };
  }
  const prices = used.map(o => Number(o.priceHuf));
  const newest = Math.max(...used.map(o => toTime(o.transactionDate)));
  return {
    cardId: card.id,
    basis,
    estimatedUnitPriceHuf: Math.round(median(prices)),
    lowHuf: Math.round(Math.min(...prices)),
    highHuf: Math.round(Math.max(...prices)),
    sourceObservationIds: used.map(o => o.id).sort(),
    method,
    confidence,
    sampleSize: used.length,
    newestTransactionDate: new Date(newest).toISOString().slice(0, 10),
    stale: now - newest > staleDays * DAY,
  };
}

function latestValuation(cardId, valuations) {
  let best = null;
  for (const v of valuations) if (v.cardId === cardId && (!best || v.calculatedAt > best.calculatedAt)) best = v;
  return best;
}

// Van-e érdemi változás a tárolt utolsó becsléshez képest?
function valuationChanged(prev, next) {
  if (next.empty) return !!(prev && prev.estimatedUnitPriceHuf != null);
  if (!prev || prev.estimatedUnitPriceHuf == null) return true;
  return prev.estimatedUnitPriceHuf !== next.estimatedUnitPriceHuf || prev.basis !== next.basis ||
    (prev.sourceObservationIds || []).join('|') !== next.sourceObservationIds.join('|');
}

function isStale(v, staleDays, now = Date.now()) {
  if (!v || v.estimatedUnitPriceHuf == null) return true;
  const t = toTime(v.newestTransactionDate);
  return t == null || now - t > staleDays * DAY;
}

// Aktuális portfólió a tárolt becslésekből
function portfolioNow(cards, valuations) {
  const items = []; let total = 0, cost = 0, valuedCost = 0, missing = 0, count = 0;
  for (const c of cards) {
    const q = Number(c.quantity) || 0;
    if (q <= 0) continue;
    count += q;
    const acq = (Number(c.acquisitionUnitPriceHuf) || 0) * q;
    cost += acq;
    const v = latestValuation(c.id, valuations);
    if (v && v.estimatedUnitPriceHuf != null) {
      items.push({ cardId: c.id, valuationId: v.id, qty: q, unitHuf: v.estimatedUnitPriceHuf });
      total += q * v.estimatedUnitPriceHuf;
      valuedCost += acq;
    } else missing++;
  }
  return { items, total, cost, valuedCost, unrealized: total - valuedCost, missing, count };
}

// Változás felbontása: piaci átértékelés vs. vétel/eladás (nettó hozzájárulás)
function splitChange(prevItems, nowItems) {
  const prev = new Map((prevItems || []).map(i => [i.cardId, i]));
  let market = 0, totalPrev = 0, totalNow = 0;
  for (const i of prevItems || []) totalPrev += i.qty * i.unitHuf;
  for (const i of nowItems) {
    totalNow += i.qty * i.unitHuf;
    const p = prev.get(i.cardId);
    if (p) market += Math.min(p.qty, i.qty) * (i.unitHuf - p.unitHuf);
  }
  return { market, net: (totalNow - totalPrev) - market, total: totalNow - totalPrev, totalPrev, totalNow };
}

function snapshotDiffers(lastSnap, now) {
  if (!lastSnap) return now.items.length > 0;
  const a = (lastSnap.valuationsUsed || []).map(i => `${i.cardId}:${i.qty}:${i.unitHuf}`).sort().join('|');
  const b = now.items.map(i => `${i.cardId}:${i.qty}:${i.unitHuf}`).sort().join('|');
  return a !== b;
}

function buildSnapshot(now, lastSnap, ts) {
  const sp = splitChange(lastSnap ? lastSnap.valuationsUsed : [], now.items);
  return {
    timestamp: ts,
    totalValueHuf: Math.round(now.total),
    totalCostBasisHuf: Math.round(now.cost),
    unrealizedPnLHuf: Math.round(now.unrealized),
    cardsCount: now.count,
    valuationsUsed: now.items,
    marketChangeHuf: Math.round(sp.market),
    netContributionsHuf: Math.round(sp.net),
  };
}

// Átlagos bekerülési ár darabszám-növeléskor
function mergeAcquisition(q0, a0, q1, a1) {
  const q = q0 + q1;
  if (q <= 0) return 0;
  return Math.round(((q0 * (a0 || 0)) + (q1 * (a1 || 0))) / q);
}

// ===== Duplikáció =====
function identityKey(c) {
  const n = v => String(v ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9/]/g, '');
  return [c.player, c.year, c.set, c.cardNumber, c.parallel, c.serialNumber].map(n).join('|');
}
function hamming(a, b) {
  if (!a || !b || a.length !== b.length) return 99;
  let d = 0;
  for (let i = 0; i < a.length; i++) {
    let x = parseInt(a[i], 16) ^ parseInt(b[i], 16);
    while (x) { d += x & 1; x >>= 1; }
  }
  return d;
}
function findDuplicates(draft, cards, draftHash) {
  const key = identityKey(draft);
  const hasIdentity = draft.player && (draft.cardNumber || draft.set);
  const out = [];
  for (const c of cards) {
    const reasons = [];
    if (hasIdentity && identityKey(c) === key) reasons.push('azonos adatok');
    if (draftHash && c.frontHash && hamming(draftHash, c.frontHash) <= 8) reasons.push('nagyon hasonló fotó');
    if (reasons.length) out.push({ card: c, reasons });
  }
  return out;
}

// ===== CSV =====
function parseNumber(s) {
  if (typeof s === 'number') return s;
  let t = String(s ?? '').replace(/[\s ]/g, '').replace(/(Ft|HUF|USD|EUR|\$|€)/gi, '');
  if (!t) return NaN;
  if (t.includes(',') && t.includes('.')) {
    if (t.lastIndexOf(',') > t.lastIndexOf('.')) t = t.replace(/\./g, '').replace(',', '.');
    else t = t.replace(/,/g, '');
  } else if (t.includes(',')) t = t.replace(',', '.');
  return Number(t);
}

function parseCSV(text) {
  text = String(text || '').replace(/^﻿/, '');
  const firstLine = text.split(/\r?\n/)[0] || '';
  const sep = (firstLine.match(/;/g) || []).length >= (firstLine.match(/,/g) || []).length && firstLine.includes(';') ? ';'
    : firstLine.includes('\t') ? '\t' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === sep) { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(cur); cur = '';
      if (row.some(c => c.trim() !== '')) rows.push(row);
      row = [];
    } else cur += ch;
  }
  row.push(cur);
  if (row.some(c => c.trim() !== '')) rows.push(row);
  return rows;
}

const OBS_ALIASES = {
  cardId: ['cardid', 'kartyaid', 'lapid', 'kartya'],
  transactionDate: ['transactiondate', 'datum', 'eladasdatuma', 'date', 'solddate'],
  price: ['price', 'ar', 'priceoriginal', 'osszeg', 'eladasiar'],
  currency: ['currency', 'deviza', 'penznem'],
  saleType: ['saletype', 'tipus', 'type'],
  conditionGrade: ['conditiongrade', 'allapot', 'grade', 'minosites'],
  sourceName: ['sourcename', 'forras', 'source'],
  sourceUrl: ['sourceurl', 'url', 'link'],
  exactMatch: ['exactmatch', 'pontosegyezes', 'egyezes', 'pontos'],
  notes: ['notes', 'megjegyzes', 'note'],
};
function normHeader(h) { return String(h).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, ''); }
function mapSaleType(v) {
  const s = normHeader(v);
  if (['sold', 'eladott', 'eladva', 'eladas', 'lezart'].includes(s)) return 'sold';
  if (['listing', 'hirdetes', 'hirdetesiar', 'aktiv', 'listed'].includes(s)) return 'listing';
  if (['manual', 'kezi', 'kezibecsles'].includes(s)) return 'manual';
  return null;
}
function parseBool(v) { const s = normHeader(v); return ['igen', 'yes', 'true', '1', 'i', 'y'].includes(s) ? true : ['nem', 'no', 'false', '0', 'n'].includes(s) ? false : null; }

function toIsoDate(v) {
  const s = String(v || '').trim().replace(/\s/g, '').replace(/\.$/, '');
  let m = s.match(/^(\d{4})[.\-/](\d{1,2})[.\-/](\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  m = s.match(/^(\d{1,2})[.\-/](\d{1,2})[.\-/](\d{4})/);
  if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  const t = Date.parse(s);
  return isNaN(t) ? null : new Date(t).toISOString().slice(0, 10);
}

// rows -> {valid:[obs draft], errors:[{line,msg}]}
function rowsToObservations(rows, { cardId = null, rates = {}, exactDefault = null, knownCardIds = null } = {}) {
  const errors = [], valid = [];
  if (!rows.length) return { valid, errors: [{ line: 0, msg: 'Üres CSV.' }] };
  const header = rows[0].map(normHeader);
  const idx = {};
  for (const [k, al] of Object.entries(OBS_ALIASES)) idx[k] = header.findIndex(h => al.includes(h));
  if (idx.transactionDate < 0 || idx.price < 0) return { valid, errors: [{ line: 1, msg: 'Hiányzó kötelező oszlop: dátum és ár.' }] };
  if (!cardId && idx.cardId < 0) return { valid, errors: [{ line: 1, msg: 'Hiányzik a kartya_id oszlop.' }] };
  rows.slice(1).forEach((r, i) => {
    const line = i + 2, g = k => idx[k] >= 0 ? String(r[idx[k]] ?? '').trim() : '';
    const cid = cardId || g('cardId');
    if (knownCardIds && !knownCardIds.has(cid)) return errors.push({ line, msg: `Ismeretlen kártya-azonosító: ${cid || '(üres)'}` });
    const date = toIsoDate(g('transactionDate'));
    if (!date) return errors.push({ line, msg: 'Érvénytelen vagy hiányzó dátum.' });
    const price = parseNumber(g('price'));
    if (!(price > 0)) return errors.push({ line, msg: 'Érvénytelen ár.' });
    const cur = (g('currency') || 'HUF').toUpperCase().replace('FT', 'HUF');
    let priceHuf, fxRate = null;
    if (cur === 'HUF') priceHuf = price;
    else if (rates[cur] > 0) { fxRate = rates[cur]; priceHuf = price * rates[cur]; }
    else return errors.push({ line, msg: `Nincs beállítva ${cur}/HUF árfolyam a Beállításokban.` });
    const st = g('saleType') ? mapSaleType(g('saleType')) : 'sold';
    if (!st) return errors.push({ line, msg: `Ismeretlen típus: ${g('saleType')} (sold / listing / manual)` });
    const src = g('sourceName');
    if (st !== 'manual' && !src) return errors.push({ line, msg: 'Hiányzó forrás (eladott/hirdetési árnál kötelező).' });
    let exact = idx.exactMatch >= 0 ? parseBool(g('exactMatch')) : exactDefault;
    if (exact == null) exact = false;
    valid.push({
      cardId: cid, transactionDate: date, priceOriginal: price, currency: cur, priceHuf: Math.round(priceHuf), fxRate,
      saleType: st, conditionGrade: normGrade(g('conditionGrade')), sourceName: src || 'Kézi becslés',
      sourceUrl: g('sourceUrl'), exactMatch: exact, notes: g('notes'),
    });
  });
  return { valid, errors };
}

// ===== Helyi tároló (IndexedDB) – GitHub/önálló futtatáshoz, ugyanazzal a felülettel =====
const IDB = {
  _db: null,
  open() {
    if (this._db) return this._db;
    this._db = new Promise((res, rej) => {
      const r = indexedDB.open('laptrezor', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return this._db;
  },
  async tx(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('kv', mode), st = t.objectStore('kv'); let out;
      Promise.resolve(fn(st, v => out = v)).catch(rej);
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('Tárolási hiba (megtelt?)'));
    });
  },
};
function localDb() {
  const seg = p => p.split('/').length;
  const mkDoc = p => ({
    id: p.split('/').pop(), path: p,
    get: () => IDB.tx('readonly', (st, set) => { const r = st.get(p); r.onsuccess = () => set({ id: p.split('/').pop(), exists: r.result !== undefined, data: () => r.result }); }),
    set: d => IDB.tx('readwrite', st => { st.put(JSON.parse(JSON.stringify(d)), p); }),
    delete: () => IDB.tx('readwrite', st => { st.delete(p); }),
    collection: n => mkCol(p + '/' + n),
  });
  const mkCol = p => ({
    path: p, doc: id => mkDoc(p + '/' + id),
    get: () => IDB.tx('readonly', (st, set) => {
      const docs = [], range = IDBKeyRange.bound(p + '/', p + '/￿');
      const r = st.openCursor(range);
      r.onsuccess = () => { const c = r.result; if (c) { if (seg(c.key) === seg(p) + 1) { const v = c.value; docs.push({ id: c.key.split('/').pop(), exists: true, data: () => v }); } c.continue(); } else set({ docs, size: docs.length, empty: !docs.length }); };
    }),
  });
  return { doc: mkDoc, collection: mkCol };
}

function loadImg(src) { return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('A kép nem olvasható.')); im.src = src; }); }
function canvasFrom(img, max, rot = 0) {
  const s = Math.min(1, max / Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height));
  const w = Math.round((img.naturalWidth || img.width) * s), h = Math.round((img.naturalHeight || img.height) * s);
  const c = document.createElement('canvas');
  const r = ((rot % 360) + 360) % 360;
  c.width = r % 180 ? h : w; c.height = r % 180 ? w : h;
  const x = c.getContext('2d');
  x.translate(c.width / 2, c.height / 2); x.rotate(r * Math.PI / 180); x.drawImage(img, -w / 2, -h / 2, w, h);
  return c;
}
function dHash(img) {
  const c = document.createElement('canvas'); c.width = 9; c.height = 8;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0, 9, 8);
  const d = x.getImageData(0, 0, 9, 8).data; let bits = '';
  for (let y = 0; y < 8; y++) for (let i = 0; i < 8; i++) {
    const p = (y * 9 + i) * 4, q = p + 4;
    bits += (d[p] * .3 + d[p + 1] * .59 + d[p + 2] * .11) > (d[q] * .3 + d[q + 1] * .59 + d[q + 2] * .11) ? '1' : '0';
  }
  let hex = ''; for (let i = 0; i < 64; i += 4) hex += parseInt(bits.slice(i, i + 4), 2).toString(16);
  return hex;
}

  const [h, b] = u.split(','); const bin = atob(b); const a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return new Blob([a], { type: (h.match(/data:([^;]+)/) || [])[1] || 'image/jpeg' });
}
function toBlob(c, q) { return new Promise(r => c.toBlob(r, 'image/jpeg', q)); }
async function processImage(src, rot = 0) {
  const img = await loadImg(src);
  const aiC = canvasFrom(img, 1400, rot);
  const blob = await toBlob(aiC, .86);
  let max = 760, q = .78, dataUrl;
  do { dataUrl = canvasFrom(img, max, rot).toDataURL('image/jpeg', q); max -= 80; q -= .05; } while (dataUrl.length > 230000 && max > 300);
  const thumb = canvasFrom(img, 240, rot).toDataURL('image/jpeg', .72);
  const rotated = await loadImg(dataUrl);
  return { blob, dataUrl, thumb, hash: dHash(rotated), w: rotated.width, h: rotated.height };

function applyAI(d, j) {
  for (const k of ['player', 'year', 'manufacturer', 'set', 'cardNumber', 'parallel', 'serialNumber']) d[k] = j[k] == null ? '' : String(j[k]);
  if (j.features) for (const k of Object.keys(d.features)) d.features[k] = !!j.features[k];
  d.confidence = j.confidence || {}; d.unreadable = Array.isArray(j.unreadable) ? j.unreadable : [];
  d.warnings = Array.isArray(j.warnings) ? j.warnings : []; d.overallConfidence = typeof j.overallConfidence === 'number' ? j.overallConfidence : null;
  const c = j.condition;
  if (c && ['centering', 'corners', 'edges', 'surface'].some(k => typeof c[k] === 'number'))
    d.condition = { centering: c.centering ?? null, corners: c.corners ?? null, edges: c.edges ?? null, surface: c.surface ?? null, overall: c.overall ?? null, notes: c.notes || '', method: d.source === 'paste' ? 'Claude chat, vizuális (nem hivatalos)' : 'Claude AI, vizuális (nem hivatalos)', estimatedAt: nowIso() };
}

function gradeGroups(c) {
  const exact = S.obs.filter(o => o.cardId === c.id && o.exactMatch && o.saleType === 'sold');
  const groups = {};
  for (const o of exact) (groups[normGrade(o.conditionGrade)] ||= []).push(o);
  const out = {};
  for (const [g, arr] of Object.entries(groups)) {
    const pr = arr.map(o => o.priceHuf);
    out[g] = { n: arr.length, med: median(pr), lo: Math.min(...pr), hi: Math.max(...pr), last: arr.map(o => o.transactionDate).sort().pop() };
  }
  return out;
}

  ${gradeVerdict(c, groups)}
  <button class="btn primary block mt2" data-act="recalcCard">${I.refresh} Érték újraszámolása</button>
  <p class="tiny muted">Csak akkor ír új értéket, ha a rögzített árak alapján ténylegesen változott a becslés.</p>`;
}

function gradeVerdict(c, groups) {
  const raw = groups['RAW'], p9 = groups['PSA 9'], p10 = groups['PSA 10'];
  const cost = Number(S.settings.gradingCostHuf) || null;
  const g = c.visualGradeEstimate?.overall;
  let title = 'Megéri graderelni?', body, good = false;
  if (normGrade(c.valuationBasis) !== 'RAW') body = 'Ez a példány már minősített (' + esc(gradeLabel(c.valuationBasis)) + ').';
  else if (!raw || (!p9 && !p10)) body = 'Nincs elég összehasonlító adat a döntéshez: kell nyers és legalább egy PSA 9 vagy PSA 10 eladási ár.';
  else {
    const prem9 = p9 ? p9.med - raw.med : null, prem10 = p10 ? p10.med - raw.med : null;
    const parts = [];
    if (prem9 != null) parts.push(`PSA 9 esetén a különbözet ${fmtSigned(prem9)} (${fmtPct(prem9 / raw.med * 100)})`);
    if (prem10 != null) parts.push(`PSA 10 esetén ${fmtSigned(prem10)} (${fmtPct(prem10 / raw.med * 100)})`);
    if (cost) {
      const n9 = prem9 != null ? prem9 - cost : null, n10 = prem10 != null ? prem10 - cost : null;
      if (n9 != null && n9 > 0) { good = true; title = 'Megérheti graderelni'; }
      else if (n10 != null && n10 > 0) title = 'Csak PSA 10 esetén éri meg';
      else title = 'A jelenlegi adatok alapján nem éri meg';
      parts.push(`a beállított ${fmtHuf(cost)} gradelési költséggel számolva`);
    } else parts.push('állítsd be a gradelési költséget a Beállításokban a pontosabb döntéshez');
    body = parts.join('; ') + '.' + (g != null ? ` A vizuális becslés ${g}/10 – ez nem garancia a hivatalos eredményre.` : '');
  }
  return `<div class="verdict ${good ? '' : 'neutral'} mt">${good ? I.check : I.info.replace('<svg', '<svg style="color:var(--muted)"')}<div><b>${esc(title)}</b><div class="small" style="color:#d8d4cf;margin-top:3px">${body}</div></div></div>`;
}

function bind() {
  const app = $('#app');
  app.querySelectorAll('[data-act]').forEach(el => el.onclick = e => { e.preventDefault(); ACT[el.dataset.act]?.(el); });
  app.querySelectorAll('[data-tab2]').forEach(el => el.onclick = () => tab(el.dataset.tab2));
  app.querySelectorAll('[data-open]').forEach(el => el.onclick = () => go('card', { id: el.dataset.open }));
  app.querySelectorAll('[data-openv]').forEach(el => el.onclick = () => go('value', { id: el.dataset.openv }));
  app.querySelectorAll('[data-side]').forEach(el => el.onclick = () => { S.scan.side = el.dataset.side; render(); });
  app.querySelectorAll('[data-file]').forEach(el => el.onchange = e => onFile(el.dataset.file, e.target.files[0], e.target));
  app.querySelectorAll('[data-feat]').forEach(el => el.onclick = () => { S.draft.features[el.dataset.feat] = !S.draft.features[el.dataset.feat]; el.classList.toggle('on'); });
  app.querySelectorAll('[data-d]').forEach(el => el.oninput = () => {
    const k = el.dataset.d; let v = el.value;
    if (k === 'valuationBasis') v = normGrade(v);
    S.draft[k] = v;
    if (k === 'player') app.querySelector('.pname').textContent = v || 'Ismeretlen játékos';
  });
  app.querySelectorAll('[data-d]').forEach(el => el.onchange = () => { if (['player', 'year', 'set', 'cardNumber', 'parallel', 'serialNumber'].includes(el.dataset.d)) { const y = scrollY; render(); scrollTo(0, y); } });
  app.querySelectorAll('input[name=dup]').forEach(el => el.onchange = () => { S.draft.dupChoice = el.value; const y = scrollY; render(); scrollTo(0, y); });
  app.querySelectorAll('[data-rmtag]').forEach(el => el.onclick = () => removeTag(+el.dataset.rmtag));
  app.querySelectorAll('[data-rmobs]').forEach(el => el.onclick = () => removeObs(el.dataset.rmobs));
  const q = $('#q'); if (q) q.oninput = () => { S.homeQuery = q.value; const pos = q.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); };
  const so = $('#sort'); if (so) { so.value = S.homeSort; so.onchange = () => { S.homeSort = so.value; render(); }; }
  const ss = $('#showSold'); if (ss) ss.onchange = () => { S.showSold = ss.checked; render(); };
  if (S.view === 'card') loadPhotos();
}

async function loadPhotos() {
  const c = cardById(S.params.id); const box = $('#photos'); if (!c || !box) return;
  const slots = [['front', 'Előlap'], ['back', 'Hátlap']];
  const parts = await Promise.all(slots.map(async ([side, l]) => {
    const id = (c.images || []).find(x => x.side === side)?.id;
    if (!id) return `<div class="p">Nincs ${l.toLowerCase()} fotó</div>`;
    let img = imgCache.get(id);
    if (!img) { try { img = await Store.getImage(id); if (img) imgCache.set(id, img); } catch { } }
    return img ? `<div class="p"><img src="${img.dataUrl}" alt="${l}"></div>` : `<div class="p">${l}: nem tölthető be</div>`;
  }));
  if ($('#photos') === box) box.innerHTML = parts.join('');
}

async function onFile(kind, file, input) {
  if (!file) return;
  if (kind === 'importJson') { input.value = ''; return importJson(file); }
  try {
    busy('Kép feldolgozása…');
    const url = URL.createObjectURL(file);
    const p = await processImage(url);
    p.src = url; p.rot = 0;
    S.scan[S.scan.side] = p;
    if (S.scan.side === 'front' && !S.scan.back) S.scan.side = 'front';
  } catch (e) { toast(e.message || 'A kép nem dolgozható fel.', true); }
  finally { busy(); input.value = ''; render(); }
}

const ACT = {
  back, newScan() { resetScan(); go('scan'); },
  shoot() { const i = $('#camIn'); if (!i) return; try { i.value = ''; i.click(); } catch { toast('A kamera nem nyitható meg – használd a galéria gombot.', true); } },
  gallery() { const i = $('#galIn'); if (!i) return; i.value = ''; i.click(); },
  async rotate() {
    const cur = S.scan[S.scan.side]; if (!cur) return toast('Előbb készíts vagy válassz fotót.');
    busy('Forgatás…'); try { const r = (cur.rot + 90) % 360; const p = await processImage(cur.src, r); p.src = cur.src; p.rot = r; S.scan[S.scan.side] = p; } finally { busy(); render(); }
  },
  async analyze() {
    if (!S.scan.front) return;
    const ctrl = new AbortController();
    busy('Claude elemzi a lapot…', () => ctrl.abort());
    try {
      const images = [S.scan.front.blob, S.scan.back?.blob].filter(Boolean);
      const res = await AI.sample(ID_PROMPT + `\nKépek: ${images.length === 2 ? '1. előlap, 2. hátlap' : '1. előlap (hátlap nincs)'}.`, { images, modelTier: 'complex', signal: ctrl.signal, cache: false });
      const j = extractJSON(res.text);
      const d = newDraft('ai'); applyAI(d, j);
      S.draft = d; busy(); go('identify');
    } catch (e) {
      busy();
      if (e?.name === 'AbortError') return toast('Elemzés megszakítva.');
      if (e?.code === 'not_granted') { S.ai.available = false; render(); return toast('Az AI-hívás nincs engedélyezve. Használd a Claude chat módszert.', true); }
      if (e?.code === 'rate_limited') return toast('Túl sok kérés – várj egy kicsit, majd próbáld újra.', true);
      toast('Az elemzés nem sikerült: ' + (e?.message || e?.code || e) + '. Próbáld újra, vagy töltsd ki kézzel.', true);
    }
  },
  chatMethod(_el, gradeCardId = null) {
    modal(`<h3>${gradeCardId ? 'Állapotbecslés Claude chatben' : 'Claude chat módszer'}</h3>
      <ol class="small" style="padding-left:18px;color:#d8d4cf"><li>Másold ki az alábbi utasítást.</li><li>Nyiss egy Claude chatet, csatold a lap előlapjának és hátlapjának fotóját, és illeszd be az utasítást.</li><li>A válaszként kapott JSON-t illeszd be ide.</li></ol>
      <button class="btn block" id="cpP">${I.copy} Utasítás másolása</button>

      <div class="two mt"><button class="btn" data-close>Mégse</button><button class="btn primary" id="pjOk">Feldolgozás</button></div>`, el => {
      el.querySelector('#cpP').onclick = () => copyText(ID_PROMPT, 'Utasítás másolva');
      el.querySelector('#pjOk').onclick = () => {
        try {
          const j = extractJSON(el.querySelector('#pj').value); const d = newDraft('paste'); applyAI(d, j);
          if (gradeCardId) {
            if (!d.condition) throw new Error('a válaszban nincs állapotbecslés');
            const c = cardById(gradeCardId); const n = { ...c, visualGradeEstimate: d.condition, conditionNotes: d.condition.notes || c.conditionNotes, updatedAt: nowIso() };
            Store.put('cards', n).then(() => { S.cards = S.cards.map(x => x.id === n.id ? n : x); closeModal(); render(); toast('Állapotbecslés frissítve.'); }).catch(() => { });
            return;
          }
          S.draft = d; closeModal(); go('identify');
        }
        catch (e) { toast('Érvénytelen JSON: ' + e.message, true); }
      };
    });
  },
  manualFromScan() { S.draft = newDraft('manual'); go('identify'); },
  manualNew() { resetScan(); S.draft = newDraft('manual'); go('identify'); },
  discardDraft: async () => { if (await confirmBox('Elveted?', 'Az azonosítás adatai és a fotók nem kerülnek mentésre.', 'Elvetés', true)) { S.draft = null; resetScan(); tab('home'); } },
  async saveDraft() {
    const d = S.draft;
    const qty = Math.max(1, parseInt(d.quantity) || 1), acq = Math.max(0, Number(d.acquisitionUnitPriceHuf) || 0);
    if (!d.player.trim() && !d.set.trim()) return toast('Adj meg legalább játékost vagy szettet.', true);
    busy('Mentés…');
    try {
      if (d.dupChoice && d.dupChoice !== 'new') {
        const c = { ...cardById(d.dupChoice) };
        c.acquisitionUnitPriceHuf = mergeAcquisition(Number(c.quantity) || 0, Number(c.acquisitionUnitPriceHuf) || 0, qty, acq);
        c.quantity = (Number(c.quantity) || 0) + qty; c.updatedAt = nowIso();

        await Store.put('cards', c); S.cards = S.cards.map(x => x.id === c.id ? c : x);
        S.draft = null; resetScan(); busy(); toast('Darabszám növelve.'); S.stack = [{ view: 'home', params: {} }]; go('card', { id: c.id }, false); return;
      }
      const id = genId('c'), images = [];
      for (const side of ['front', 'back']) {

      }
      const card = {
        id, player: d.player.trim(), year: d.year.trim(), manufacturer: d.manufacturer.trim(), set: d.set.trim(), cardNumber: d.cardNumber.trim(),
        parallel: d.parallel.trim(), serialNumber: d.serialNumber.trim(), features: Object.keys(d.features).filter(k => d.features[k]),

        acquisitionUnitPriceHuf: acq, valuationBasis: normGrade(d.valuationBasis), conditionNotes: d.condition?.notes || '',
        visualGradeEstimate: d.condition || null, tags: [], notes: '', sales: [],

        createdAt: nowIso(), updatedAt: nowIso(),

      await Store.put('cards', card); S.cards.push(card);

      <div class="two mt2"><button class="btn" data-close>Mégse</button><button class="btn primary" id="sOk">Rögzítés</button></div>`, el => {
      el.querySelector('#sOk').onclick = async () => {
        const qn = parseInt(el.querySelector('#sq').value), pr = Number(el.querySelector('#sp').value);
        if (!(qn >= 1 && qn <= c.quantity)) return toast('Érvénytelen darabszám.', true);
        const n = { ...c, quantity: c.quantity - qn, sales: [...(c.sales || []), { date: el.querySelector('#sd').value, qty: qn, unitPriceHuf: pr || 0, costUnitHuf: c.acquisitionUnitPriceHuf }], updatedAt: nowIso() };
        try { await Store.put('cards', n); S.cards = S.cards.map(x => x.id === n.id ? n : x); closeModal(); render(); toast('Eladás rögzítve.'); } catch { }

  async deleteCard() {
    const c = cardById(S.params.id);
    if (!await confirmBox('Lap törlése', `<b>${esc(cardTitle(c))}</b> – a lap, a fotói, az ármegfigyelései és a becslései véglegesen törlődnek. Ha eladtad, inkább az „Eladás rögzítése” kell.`, 'Végleges törlés', true)) return;
    busy('Törlés…');
    try {
      for (const im of c.images || []) { await Store.delImage(im.id); imgCache.delete(im.id); }
      for (const o of S.obs.filter(o => o.cardId === c.id)) await Store.del('observations', o.id);

  editNote() {

      el.querySelector('#nOk').onclick = async () => { const n = { ...c, notes: el.querySelector('#nt').value, updatedAt: nowIso() }; try { await Store.put('cards', n); S.cards = S.cards.map(x => x.id === n.id ? n : x); closeModal(); render(); } catch { } };
    });
  },
  addTag() {
    const c = cardById(S.params.id);
    const all = [...new Set(S.cards.flatMap(x => x.tags || []))].filter(t => !(c.tags || []).includes(t));
    modal(`<h3>Címke hozzáadása</h3><label class="field"><input id="tg" placeholder="pl. Kedvenc, Gradelés tervben, Hosszú táv"></label>${all.length ? `<div class="chips mt">${all.map(t => `<span class="chip" data-t="${esc(t)}" style="cursor:pointer">${esc(t)}</span>`).join('')}</div>` : ''}<div class="two mt2"><button class="btn" data-close>Mégse</button><button class="btn primary" id="tOk">Hozzáadás</button></div>`, el => {
      const add = async t => { t = t.trim(); if (!t) return; const n = { ...c, tags: [...new Set([...(c.tags || []), t])], updatedAt: nowIso() }; try { await Store.put('cards', n); S.cards = S.cards.map(x => x.id === n.id ? n : x); closeModal(); render(); } catch { } };
      el.querySelector('#tOk').onclick = () => add(el.querySelector('#tg').value);
      el.querySelectorAll('[data-t]').forEach(x => x.onclick = () => add(x.dataset.t));

  },
  async regrade() {
    const c = cardById(S.params.id);
    const front = (c.images || []).find(i => i.side === 'front'), backI = (c.images || []).find(i => i.side === 'back');
    if (!(S.ai.available && S.ai.images)) return ACT.chatMethod(null, c.id);
    if (!front) return toast('Ehhez a laphoz nincs fotó.', true);
    const ctrl = new AbortController(); busy('Állapot becslése…', () => ctrl.abort());
    try {
      const blobs = [];
      for (const im of [front, backI].filter(Boolean)) { const d = imgCache.get(im.id) || await Store.getImage(im.id); if (d) blobs.push(dataUrlToBlob(d.dataUrl)); }
      const res = await AI.sample(ID_PROMPT + '\nEbben a körben főleg az állapotbecslés a fontos.', { images: blobs, modelTier: 'complex', signal: ctrl.signal, cache: false });
      const j = extractJSON(res.text); const tmp = newDraft('ai'); applyAI(tmp, j);
      if (!tmp.condition) throw new Error('A fotó alapján nem becsülhető az állapot.');
      const n = { ...c, visualGradeEstimate: tmp.condition, conditionNotes: tmp.condition.notes || c.conditionNotes, updatedAt: nowIso() };
      await Store.put('cards', n); S.cards = S.cards.map(x => x.id === n.id ? n : x); busy(); render(); toast('Állapotbecslés frissítve.');
    } catch (e) { busy(); if (e?.name !== 'AbortError') toast('Nem sikerült: ' + (e?.message || e?.code || e), true); }
  },
  addObs() {
    const c = cardById(S.params.id);
    modal(`<h3>Ár rögzítése</h3><p class="tiny muted">${esc(cardTitle(c))} · ${esc(cardSub(c))}</p>
      <div class="two"><label class="field"><span>Típus</span><select id="ot"><option value="sold">Eladott ár</option><option value="listing">Hirdetési ár</option><option value="manual">Kézi becslés</option></select></label><label class="field"><span>Eladás dátuma</span><input id="od" type="date" value="${today()}"></label></div>
      <div class="two"><label class="field"><span>Ár</span><input id="op" type="number" step="0.01" min="0" inputmode="decimal"></label><label class="field"><span>Deviza</span><select id="oc"><option>HUF</option><option>USD</option><option>EUR</option></select></label></div>
      <label class="field"><span>Állapot (Nyers / PSA 9 / BGS 9.5…)</span><input id="og" value="${esc(gradeLabel(c.valuationBasis))}"></label>
      <div class="two"><label class="field"><span>Forrás neve</span><input id="os" placeholder="pl. eBay, 130point, Vatera"></label><label class="field"><span>Forrás URL</span><input id="ou" type="url" placeholder="https://…"></label></div>
      <label class="field"><span>Megjegyzés</span><input id="on"></label>
      <label class="check"><input type="checkbox" id="oe" checked> Pontos egyezés: azonos játékos, év, szett, lapszám, parallel és sorszámozás</label>
      <div class="two mt2"><button class="btn" data-close>Mégse</button><button class="btn primary" id="oOk">Rögzítés</button></div>`, el => {
      el.querySelector('#oOk').onclick = async () => {
        const g = s => el.querySelector(s).value.trim();
        const header = ['kartya_id', 'datum', 'ar', 'deviza', 'tipus', 'allapot', 'forras', 'url', 'pontos_egyezes', 'megjegyzes'];
        const r = rowsToObservations([header, [c.id, g('#od'), g('#op'), g('#oc'), g('#ot'), g('#og'), g('#os'), g('#ou'), el.querySelector('#oe').checked ? 'igen' : 'nem', g('#on')]], { rates: rates() });
        if (r.errors.length) return toast(r.errors[0].msg, true);
        const n = await saveObs(r.valid); if (n) { closeModal(); render(); toast('Ár rögzítve. Az „Érték újraszámolása” gombbal frissítheted a becslést.'); }
      };
    });
  },
  importObs() { importDialog(S.params.id); },
  bulkImport() { importDialog(null); },
  pricePrompt() {
    const c = cardById(S.params.id);
    const p = `Keress a weben valódi, LEZÁRT (eladott) eladásokat erre a kosárlabda gyűjtői kártyára, az elmúlt 6 hónapból:
Játékos: ${c.player || '?'}
Év: ${c.year || '?'}
Gyártó: ${c.manufacturer || '?'}
Szett: ${c.set || '?'}
Lapszám: ${c.cardNumber || '?'}
Parallel/változat: ${c.parallel || 'base'}
Sorszámozás: ${c.serialNumber || 'nincs'}
Jellemzők: ${(c.features || []).join(', ') || '—'}

Szabályok:
- Csak ténylegesen talált, forrással ellenőrizhető adatot adj meg, mindegyikhez a konkrét URL-lel. Ne becsülj, ne találj ki árat.

Válasz: egy CSV kódblokk, pontosvesszővel elválasztva, pontosan ezzel a fejléccel:
datum;ar;deviza;tipus;allapot;forras;url;pontos_egyezes;megjegyzes
(datum: ÉÉÉÉ-HH-NN, ar: szám, deviza: USD/EUR/HUF)`;
    copyText(p, 'Árkereső prompt másolva – illeszd be egy webkeresős Claude chatbe');
  },
  async recalcCard() {
    const c = cardById(S.params.id);
    const r = await revalue([c]);
    toast(r ? 'Becslés frissítve.' : 'Nincs ellenőrzött új ár – a becslés nem változott.');
    render();
  },
  async refreshAll() {
    const held = S.cards.filter(c => (Number(c.quantity) || 0) > 0);
    busy('Portfólió frissítése…');
    try {
      const changed = await revalue(held);
      const now = portfolioNow(S.cards, S.vals);
      const last = S.snaps[S.snaps.length - 1];
      if (!snapshotDiffers(last, now)) { busy(); toast(changed ? 'A becslések frissültek, a portfólió értéke nem változott.' : 'Nincs ellenőrzött új ár.'); render(); return; }
      const snap = { id: genId('s'), ...buildSnapshot(now, last, nowIso()) };
      await Store.put('snapshots', snap); S.snaps.push(snap);
      busy(); toast(`Frissítve: ${fmtHuf(snap.totalValueHuf)} (piaci ${fmtSigned(snap.marketChangeHuf)}, vétel/eladás ${fmtSigned(snap.netContributionsHuf)})`); render();
    } catch { busy(); }
  },
  async saveSettings() {
    const num = id => { const v = $(id).value.trim(); return v === '' ? null : Number(v); };
    S.settings = { ...S.settings, usdHuf: num('#s_usd'), eurHuf: num('#s_eur'), gradingCostHuf: num('#s_grade'), staleDays: Math.max(1, num('#s_stale') || 90) };
    await Store.saveMeta(); toast('Beállítások mentve.'); render();
  },
  async exportJson() {
    busy('Mentés összeállítása…');
    try {
      const images = await Store.allImages();
      const data = { app: 'LapTrezor', schemaVersion: SCHEMA_VERSION, exportedAt: nowIso(), settings: S.settings, cards: S.cards, observations: S.obs, valuations: S.vals, snapshots: S.snaps, images };
      busy(); await saveFile(`laptrezor-mentes-${today()}.json`, JSON.stringify(data));
    } catch (e) { busy(); toast('Export hiba: ' + (e.message || e.code), true); }
  },
  exportCardsCsv() { saveFile(`laptrezor-lapok-${today()}.csv`, cardsCSV(S.cards, S.vals)); },
  exportObsCsv() { saveFile(`laptrezor-arak-${today()}.csv`, obsCSV(S.obs)); },
  async wipe() {
    modal(`<h3>Minden adat törlése</h3><p class="muted small">Minden lap, fotó, ár, becslés és pillanatkép véglegesen törlődik. Előtte készíts JSON mentést! A megerősítéshez írd be: <b>TÖRLÉS</b></p><label class="field"><input id="wc"></label><div class="two mt"><button class="btn" data-close>Mégse</button><button class="btn danger" id="wOk">Törlés</button></div>`, el => {
      el.querySelector('#wOk').onclick = async () => {
        if (el.querySelector('#wc').value.trim() !== 'TÖRLÉS') return toast('Írd be pontosan: TÖRLÉS', true);
        closeModal(); busy('Törlés…');
        try {
          for (const im of await Store.allImages()) await Store.delImage(im.id);
          for (const [col, arr] of [['observations', S.obs], ['valuations', S.vals], ['snapshots', S.snaps], ['cards', S.cards]]) for (const x of arr) await Store.del(col, x.id);
          S.cards = []; S.obs = []; S.vals = []; S.snaps = []; imgCache.clear(); busy(); toast('Minden adat törölve.'); tab('home');
        } catch { busy(); }
      };
    });
  },
};

async function saveObs(list) {
  const keys = new Set(S.obs.map(obsKey));
  let n = 0, skipped = 0;
  for (const o of list) {
    if (keys.has(obsKey(o))) { skipped++; continue; }
    const obs = { id: genId('o'), observedAt: nowIso(), confidence: o.exactMatch ? (o.saleType === 'sold' ? 'ellenőrzött eladás' : 'hirdetés') : 'nem pontos egyezés', ...o };
    try { await Store.put('observations', obs); S.obs.push(obs); keys.add(obsKey(o)); n++; } catch { break; }
  }
  if (skipped) toast(`${skipped} már rögzített ár kihagyva (duplikátum).`);
  return n;
}
async function removeObs(id) {
  if (!await confirmBox('Ármegfigyelés törlése', 'A becslés csak a következő újraszámoláskor változik.', 'Törlés', true)) return;
  try { await Store.del('observations', id); S.obs = S.obs.filter(o => o.id !== id); render(); } catch { }
}
async function removeTag(i) {
  const c = cardById(S.params.id); const n = { ...c, tags: (c.tags || []).filter((_, j) => j !== i), updatedAt: nowIso() };
  try { await Store.put('cards', n); S.cards = S.cards.map(x => x.id === n.id ? n : x); render(); } catch { }
}
async function revalue(cards) {
  let changed = 0;
  for (const c of cards) {
    const prev = latestValuation(c.id, S.vals);
    const next = computeValuation(c, S.obs, { staleDays: S.settings.staleDays });
    if (!valuationChanged(prev, next)) continue;
    const v = next.empty
      ? { id: genId('v'), cardId: c.id, calculatedAt: nowIso(), estimatedUnitPriceHuf: null, lowHuf: null, highHuf: null, sourceObservationIds: [], method: next.listingsOnly ? 'Csak hirdetési ár van – nem számít bele' : 'Nincs érvényes ármegfigyelés', confidence: 'nincs', stale: true, basis: next.basis }
      : { id: genId('v'), calculatedAt: nowIso(), ...next };
    await Store.put('valuations', v); S.vals.push(v); changed++;
  }
  return changed;
}

function importDialog(cardId) {
  const c = cardId ? cardById(cardId) : null;
  modal(`<h3>${c ? 'Árak importálása CSV-ből' : 'Tömeges árimport'}</h3>
    <p class="tiny muted">${c ? esc(cardTitle(c)) + ' · ' + esc(cardSub(c)) + '<br>' : ''}Fejléc (pontosvessző vagy vessző): ${c ? '' : '<b>kartya_id</b>;'}datum;ar;deviza;tipus;allapot;forras;url;pontos_egyezes;megjegyzes. A tipus: sold / listing / manual (vagy eladott / hirdetés / kézi).</p>
    <label class="btn sm block" style="position:relative">CSV fájl választása<input type="file" accept=".csv,text/csv,text/plain" class="filehidden" id="cf"></label>
    <label class="field"><span>…vagy illeszd be a CSV-t</span><textarea id="ct" placeholder="datum;ar;deviza;tipus;allapot;forras;url;pontos_egyezes"></textarea></label>
    <label class="check"><input type="checkbox" id="cx"> Ahol nincs pontos_egyezes oszlop/érték: minden sor pontos egyezés (azonos játékos, év, szett, lapszám, parallel, sorszám)</label>
    <div id="cprev"></div>
    <div class="two mt2"><button class="btn" data-close>Mégse</button><button class="btn primary" id="cOk">Ellenőrzés</button></div>`, el => {
    let parsed = null;
    el.querySelector('#cf').onchange = async e => { const f = e.target.files[0]; if (f) el.querySelector('#ct').value = await f.text(); };
    el.querySelector('#cOk').onclick = async () => {
      if (parsed) {
        const n = await saveObs(parsed.valid); closeModal(); render();
        return toast(`${n} ár importálva. Frissítsd a becslést az „Érték újraszámolása” vagy „Portfólió frissítése” gombbal.`);
      }
      const r = rowsToObservations(parseCSV(el.querySelector('#ct').value), { cardId, rates: rates(), exactDefault: el.querySelector('#cx').checked ? true : null, knownCardIds: new Set(S.cards.map(x => x.id)) });
      const sold = r.valid.filter(o => o.saleType === 'sold' && o.exactMatch).length;
      el.querySelector('#cprev').innerHTML = `<div class="banner ${r.valid.length ? 'info' : 'err'}">${r.valid.length} érvényes sor (${sold} pontos egyezésű eladás – csak ezek számítanak az értékbe), ${r.errors.length} hibás.${r.errors.slice(0, 8).map(x => `<div class="tiny">${x.line}. sor: ${esc(x.msg)}</div>`).join('')}</div>`;
      if (r.valid.length) { parsed = r; el.querySelector('#cOk').textContent = `${r.valid.length} sor importálása`; }
    };
  });
}

async function importJson(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { return toast('A fájl nem érvényes JSON.', true); }
  if (data.app !== 'LapTrezor' || !Array.isArray(data.cards)) return toast('Ez nem LapTrezor mentés.', true);
  if (data.schemaVersion > SCHEMA_VERSION) return toast('A mentés újabb sémaverziójú (' + data.schemaVersion + '), mint az alkalmazás.', true);
  const n = k => (data[k] || []).length;
  if (!await confirmBox('Mentés visszatöltése', `${n('cards')} lap, ${n('observations')} ár, ${n('valuations')} becslés, ${n('snapshots')} pillanatkép, ${n('images')} fotó (${fmtDT(data.exportedAt)}). Az azonos azonosítójú elemek felülíródnak.`, 'Visszatöltés')) return;
  busy('Visszatöltés…');
  try {
    const up = (arr, x) => { const i = arr.findIndex(y => y.id === x.id); if (i >= 0) arr[i] = x; else arr.push(x); };
    for (const im of data.images || []) { await Store.putImage(im); imgCache.set(im.id, im); }
    for (const [col, key, arr] of [['cards', 'cards', S.cards], ['observations', 'observations', S.obs], ['valuations', 'valuations', S.vals], ['snapshots', 'snapshots', S.snaps]])
      for (const x of data[key] || []) { await Store.put(col, x); up(arr, x); }
    S.snaps.sort((a, b) => a.timestamp < b.timestamp ? -1 : 1);
    if (data.settings) { S.settings = { ...S.settings, ...data.settings }; await Store.saveMeta(); }
    busy(); toast('Visszatöltés kész.'); tab('home');
  } catch (e) { busy(); toast('Visszatöltés megszakadt: ' + (e.message || e.code), true); }
}

// ===== Teljes képernyő dupla koppintásra =====
const NOFS = 'button,input,select,textarea,label,a,.tcard,.li,.badge,.chip,.seg,.frame,.sheet,nav';
function toggleFullscreen() {
  const d = document, el = d.documentElement;
  if (d.fullscreenElement || d.webkitFullscreenElement) return (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (req) { const p = req.call(el, { navigationUI: 'hide' }); p && p.catch && p.catch(() => fsHint()); }
  else fsHint();
}
function fsHint() {
  toast(/iPhone|iPad/i.test(navigator.userAgent) ? 'iPhone-on: Safari → Megosztás → „Főképernyőhöz adás”, és az ikonról teljes képernyőn indul.' : 'A teljes képernyő itt nem támogatott – tedd ki az ikont a kezdőképernyőre.');
}
let lastTap = 0, lastTouchFs = 0;
document.addEventListener('touchend', e => {
  if (e.touches.length || e.target.closest(NOFS)) { lastTap = 0; return; }
  const t = Date.now();
  if (t - lastTap < 320) { e.preventDefault(); lastTap = 0; lastTouchFs = t; toggleFullscreen(); } else lastTap = t;
}, { passive: false });
document.addEventListener('dblclick', e => { if (Date.now() - lastTouchFs < 800 || e.target.closest(NOFS)) return; toggleFullscreen(); });
if (!window.claude && 'serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { }));
}

// ===== Indítás =====
render();
(async () => {
  await Store.init();
  render();
  AI.init();
  try { if (!localStorage.getItem('lt_fs_tip') && !matchMedia('(display-mode: standalone)').matches && !matchMedia('(display-mode: fullscreen)').matches) { setTimeout(() => toast('Tipp: dupla koppintás egy üres részen = teljes képernyő'), 1200); localStorage.setItem('lt_fs_tip', '1'); } } catch { }
})();
