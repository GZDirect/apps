<!DOCTYPE html>
<html lang="hu"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alkalmazásaim</title>
<meta name="theme-color" content="#101114">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;color:#F3F1EE;font-family:Inter,system-ui,sans-serif;background:radial-gradient(ellipse 80% 40% at 50% -5%,rgba(255,150,60,.16),transparent 70%),linear-gradient(180deg,#14151a,#0c0d10);background-attachment:fixed}
main{max-width:720px;margin:0 auto;padding:calc(32px + env(safe-area-inset-top)) 18px 40px}
h1{font-size:30px;font-weight:800;margin:0 0 4px;letter-spacing:-.5px}
p.sub{color:#9CA0A8;margin:0 0 26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
a.app{display:flex;gap:14px;align-items:center;padding:16px;border-radius:20px;text-decoration:none;color:inherit;background:linear-gradient(160deg,rgba(40,44,52,.8),rgba(26,28,34,.8));border:1px solid rgba(255,255,255,.08);transition:transform .15s,border-color .15s}
a.app:hover,a.app:active{transform:translateY(-2px);border-color:rgba(255,122,26,.5)}
a.app img{width:60px;height:60px;border-radius:15px;flex:none}
a.app b{display:block;font-size:17px}
a.app span{font-size:13px;color:#9CA0A8}
.soon{opacity:.45;pointer-events:none}
footer{margin-top:30px;color:#6b6f77;font-size:12px;text-align:center}
</style></head>
<body><main>
<h1>Alkalmazásaim</h1>
<p class="sub">Saját használatra készült webappok. Telefonon nyisd meg, majd tedd ki az ikont a kezdőképernyőre.</p>
<div class="grid">
  <a class="app" href="LapTrezor/"><img src="LapTrezor/icons/icon-192.png" alt=""><div><b>LapTrezor</b><span>Kosaras kártyák gyűjteménye és értékbecslése</span></div></a>
</div>
<footer>gzdirect.github.io/apps</footer>
</main></body></html>
